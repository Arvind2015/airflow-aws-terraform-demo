name: Release

# On every merge to main, read the Conventional Commit messages since the last
# tag and bump the semantic version accordingly:
#   fix:            -> patch   (v1.2.3 -> v1.2.4)
#   feat:           -> minor   (v1.2.3 -> v1.3.0)
#   BREAKING CHANGE -> major   (v1.2.3 -> v2.0.0)
on:
  push:
    branches: [main]

permissions:
  contents: write   # required to push the tag and create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag semantic version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the action can find the last tag

      - name: Compute and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch          # merge with no feat:/fix: still bumps patch
          release_branches: main

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
