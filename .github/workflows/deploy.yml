name: Deploy

# Use case A: GitHub Actions runs Terraform.
#   - Pull request  -> terraform plan, posted as a PR comment (no changes applied)
#   - Merge to main -> terraform apply, then sync dags/ to the S3 bucket
#
# One-time setup (see terraform/README.md):
#   - GitHub repo Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   - GitHub repo Variables: AWS_REGION, DAGS_BUCKET
#   - Create the Terraform state bucket named in terraform/backend.tf

on:
  pull_request:
    paths:
      - "terraform/**"
      - "dags/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "dags/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pull-requests: write   # to post the plan comment

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_dags_bucket_name: ${{ vars.DAGS_BUCKET }}
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------------------
  plan:
    if: github.event_name == 'pull_request'
    name: terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        run: terraform plan -input=false -no-color
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `#### terraform plan — \`${{ steps.plan.outcome }}\`
            <details><summary>Show plan</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  apply:
    if: github.event_name == 'push'
    name: terraform apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: init
        run: terraform init -input=false

      - name: apply
        run: terraform apply -input=false -auto-approve

  # ---------------------------------------------------------------------------
  sync-dags:
    if: github.event_name == 'push'
    name: sync dags to S3
    runs-on: ubuntu-latest
    needs: apply   # bucket must exist first
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync DAGs
        run: |
          aws s3 sync dags/ "s3://${{ vars.DAGS_BUCKET }}/dags/" \
            --delete \
            --exclude "*" \
            --include "*.py" \
            --no-progress
